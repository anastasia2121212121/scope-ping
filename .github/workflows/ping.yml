name: keep-awake
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "17 3 1 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -s -m 120 https://scopefun-live.onrender.com/health || true
  # GitHub turns scheduled workflows off after 60 days without commits: one tiny commit a month
  monthly:
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > last-run.txt
          git config user.name "keep-awake"
          git config user.email "keep-awake@users.noreply.github.com"
          git add last-run.txt && git commit -m "monthly keep-alive" && git push
